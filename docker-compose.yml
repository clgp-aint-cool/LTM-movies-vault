services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/clgp-aint-cool/ltm-movies-vault:latest}
    build:
      context: ./site
      dockerfile: Dockerfile
    container_name: ltm-movies-vault
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
      - INSTAGRAM_TARGET_URL=${INSTAGRAM_TARGET_URL:-https://www.instagram.com/lamthanhmy/}
      - GALLERY_SYNC_TOKEN=${GALLERY_SYNC_TOKEN:-}
      - GALLERY_READ_TIMEOUT_MS=${GALLERY_READ_TIMEOUT_MS:-3000}
      - INSTAGRAM_TIMEOUT_MS=${INSTAGRAM_TIMEOUT_MS:-10000}
      - INSTAGRAM_DOWNLOAD_TIMEOUT_MS=${INSTAGRAM_DOWNLOAD_TIMEOUT_MS:-15000}
      - INSTAGRAM_MAX_RESPONSE_BYTES=${INSTAGRAM_MAX_RESPONSE_BYTES:-5000000}
      - INSTAGRAM_MAX_IMAGES=${INSTAGRAM_MAX_IMAGES:-200}
      - GALLERY_MAX_IMAGES=${GALLERY_MAX_IMAGES:-500}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:alpine
    container_name: ltm-movies-vault-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
