services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/clgp-aint-cool/ltm-movies-vault:latest}
    build:
      context: ./site
      dockerfile: Dockerfile
    container_name: ltm-movies-vault
    restart: always
    ports:
      - "${HOST_PORT:-80}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
